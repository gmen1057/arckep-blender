[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arckep-blender-mcp"
version = "0.1.0"
description = "Local MCP server connecting Blender 4.2+ scenes with ArcKep 3D generation, mesh post-processing, and RUB Budget Guard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "ArcKep" },
]
keywords = ["mcp", "blender", "3d", "gltf", "mesh", "ai", "arckep"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://arckep.ru/3d-models"
Documentation = "https://arckep.ru/developer/docs"
Repository = "https://github.com/gmen1057/arckep-blender"

[project.scripts]
arckep-blender-mcp = "arckep_blender_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arckep_blender_mcp*"]

[tool.ruff]
target-version = "py311"
line-length = 108
